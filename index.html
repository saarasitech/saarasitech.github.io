
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.125rem;
            color: #8b949e;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .subscribe-form {
            display: flex;
            gap: 10px;
            max-width: 420px;
            margin: 0 auto;
        }

        input[type="email"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background-color: #238636;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #2ea043;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.25rem; }
            .subscribe-form { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Coming Soon</h1>
        <p>We're building something new. Leave your email below to get notified when we launch.</p>
        
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Thank you for subscribing!');">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

</body>
</html>
